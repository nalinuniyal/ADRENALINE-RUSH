<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Marketing Cloud Personalization course cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f2e"/><stop offset=".55" stop-color="#3b1d8f"/><stop offset="1" stop-color="#014486"/>
    </linearGradient>
    <radialGradient id="glow" cx=".75" cy=".45" r=".5">
      <stop offset="0" stop-color="#9050e9" stop-opacity=".55"/><stop offset="1" stop-color="#9050e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" fill="#fff">
    <text x="110" y="290" font-size="30" font-weight="700" letter-spacing="6" fill="#57e3ff">SALESFORCE MARKETING</text>
    <text x="110" y="415" font-size="130" font-weight="800">MCP</text>
    <text x="110" y="485" font-size="40" fill="#fff" fill-opacity=".88">Marketing Cloud Personalization</text>
    <text x="110" y="540" font-size="34" fill="#fff" fill-opacity=".7">Real-time, 1:1 experiences on web and email</text>
    <g font-size="26" font-weight="600">
      <rect x="110" y="590" width="170" height="54" rx="27" fill="#fff" fill-opacity=".12"/><text x="195" y="626" text-anchor="middle">Sitemap</text>
      <rect x="296" y="590" width="190" height="54" rx="27" fill="#fff" fill-opacity=".12"/><text x="391" y="626" text-anchor="middle">Segments</text>
      <rect x="502" y="590" width="170" height="54" rx="27" fill="#fff" fill-opacity=".12"/><text x="587" y="626" text-anchor="middle">Einstein</text>
    </g>
  </g>
  <!-- browser with personalized recommendations -->
  <g transform="translate(900 170)" filter="url(#sh)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    <rect width="600" height="440" rx="22" fill="#ffffff"/>
    <rect width="600" height="54" rx="22" fill="#e9ecf5"/><rect y="30" width="600" height="24" fill="#e9ecf5"/>
    <circle cx="34" cy="27" r="8" fill="#ff6b6b"/><circle cx="60" cy="27" r="8" fill="#ffd166"/><circle cx="86" cy="27" r="8" fill="#06d6a0"/>
    <rect x="120" y="15" width="440" height="24" rx="12" fill="#ffffff"/>
    <text x="36" y="112" font-size="30" font-weight="800" fill="#0b0f2e">Welcome back!</text>
    <text x="36" y="148" font-size="22" fill="#3b1d8f">Recommended for you</text>
    <g>
      <rect x="36" y="172" width="164" height="210" rx="14" fill="#f1ecfd"/><rect x="52" y="188" width="132" height="110" rx="10" fill="#9050e9"/>
      <rect x="52" y="314" width="110" height="14" rx="7" fill="#0b0f2e" fill-opacity=".6"/><rect x="52" y="340" width="70" height="14" rx="7" fill="#9050e9"/>
      <rect x="218" y="172" width="164" height="210" rx="14" fill="#e6f8ff"/><rect x="234" y="188" width="132" height="110" rx="10" fill="#57e3ff"/>
      <rect x="234" y="314" width="110" height="14" rx="7" fill="#0b0f2e" fill-opacity=".6"/><rect x="234" y="340" width="70" height="14" rx="7" fill="#014486"/>
      <rect x="400" y="172" width="164" height="210" rx="14" fill="#eef2fa"/><rect x="416" y="188" width="132" height="110" rx="10" fill="#014486"/>
      <rect x="416" y="314" width="110" height="14" rx="7" fill="#0b0f2e" fill-opacity=".6"/><rect x="416" y="340" width="70" height="14" rx="7" fill="#9050e9"/>
    </g>
  </g>
  <!-- visitor profile -->
  <g transform="translate(1180 560)" filter="url(#sh)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="700">
    <rect width="340" height="190" rx="20" fill="#57e3ff"/>
    <circle cx="60" cy="62" r="30" fill="#0b0f2e"/><circle cx="60" cy="52" r="11" fill="#57e3ff"/><path d="M40 80c4-14 36-14 40 0" fill="#57e3ff"/>
    <text x="108" y="56" font-size="24" fill="#0b0f2e">Visitor profile</text>
    <text x="108" y="86" font-size="18" fill="#0b0f2e" fill-opacity=".7">Live, updated every click</text>
    <rect x="28" y="118" width="130" height="40" rx="20" fill="#0b0f2e"/><text x="93" y="144" font-size="18" fill="#fff" text-anchor="middle">High intent</text>
    <rect x="170" y="118" width="140" height="40" rx="20" fill="#ffffff"/><text x="240" y="144" font-size="18" fill="#3b1d8f" text-anchor="middle">Runner</text>
  </g>
</svg>
