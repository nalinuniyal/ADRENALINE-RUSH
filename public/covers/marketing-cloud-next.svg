<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Marketing Cloud Next course cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#032d60"/><stop offset=".6" stop-color="#0b5cab"/><stop offset="1" stop-color="#1b96ff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".76" cy=".45" r=".5">
      <stop offset="0" stop-color="#57e3ff" stop-opacity=".4"/><stop offset="1" stop-color="#57e3ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#fff" fill-opacity=".08"/></pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" fill="#fff">
    <text x="110" y="280" font-size="30" font-weight="700" letter-spacing="6" fill="#57e3ff">SALESFORCE MARKETING</text>
    <text x="110" y="390" font-size="104" font-weight="800">Marketing</text>
    <text x="110" y="500" font-size="104" font-weight="800">Cloud Next</text>
    <text x="110" y="568" font-size="36" fill="#ffffff" fill-opacity=".82">Data Cloud, Flow journeys, Agentforce</text>
    <g font-size="26" font-weight="600">
      <rect x="110" y="616" width="150" height="54" rx="27" fill="#ffffff" fill-opacity=".14"/><text x="185" y="652" text-anchor="middle">Email</text>
      <rect x="276" y="616" width="130" height="54" rx="27" fill="#ffffff" fill-opacity=".14"/><text x="341" y="652" text-anchor="middle">SMS</text>
      <rect x="422" y="616" width="200" height="54" rx="27" fill="#ffffff" fill-opacity=".14"/><text x="522" y="652" text-anchor="middle">WhatsApp</text>
    </g>
  </g>

  <!-- cloud -->
  <g transform="translate(1000 150)" filter="url(#sh)">
    <path d="M110 207c-55 0-95-44-95-98s40-99 95-99c18-42 60-70 108-70 55 0 102 38 114 90 8-2 16-3 24-3 52 0 92 40 92 90s-40 90-92 90H110z" fill="#ffffff" transform="translate(30 70)"/>
    <text x="256" y="186" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="30" font-weight="800" fill="#032d60">Data Cloud</text>
  </g>
  <!-- journey -->
  <g stroke="#57e3ff" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M1256 427v13"/>
    <path d="M1256 440c0 40-150 30-150 80M1256 440v80M1256 440c0 40 150 30 150 80"/>
  </g>
  <g filter="url(#sh)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="1036" y="520" width="140" height="120" rx="20" fill="#ffffff"/>
    <rect x="1066" y="548" width="80" height="54" rx="8" fill="none" stroke="#0b5cab" stroke-width="5"/><path d="M1066 552l40 28 40-28" fill="none" stroke="#0b5cab" stroke-width="5"/>
    <text x="1106" y="628" fill="#032d60">Email</text>
    <rect x="1186" y="520" width="140" height="120" rx="20" fill="#ffffff"/>
    <rect x="1226" y="544" width="60" height="44" rx="10" fill="#9050e9"/><path d="M1238 588l-6 16 22-16z" fill="#9050e9"/>
    <text x="1256" y="628" fill="#032d60">SMS</text>
    <rect x="1336" y="520" width="140" height="120" rx="20" fill="#ffffff"/>
    <circle cx="1406" cy="572" r="28" fill="#25d366"/><path d="M1384 600l6-18 14 10z" fill="#25d366"/>
    <text x="1406" y="628" fill="#032d60">WhatsApp</text>
  </g>
  <g stroke="#57e3ff" stroke-width="5" fill="none" stroke-linecap="round"><path d="M1106 640c0 50 150 40 150 90M1256 640v90M1406 640c0 50-150 40-150 90"/></g>
  <g filter="url(#sh)">
    <circle cx="1256" cy="760" r="42" fill="#57e3ff"/>
    <path d="M1236 760l14 14 26-28" fill="none" stroke="#032d60" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
